<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>신정하쌤 국어 문법 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<style>
/* 배치: 학교 프린트 한 장 같은 '장'을 탭으로 넘긴다. 장마다 가지 지도 → 빈칸 확인 → 확인 문제 → 실험대 → 헷갈리는 질문. 휴대폰 화면을 먼저 생각했다. */
:root{
  --bg:#f4f3f6; --paper:#fdfdfe; --ink:#1d1a22; --ink2:#3d3846; --mute:#6b6574; --line:#cfcbd6;
  --plum:#55357a; --plum-soft:#e9e2f2; --on-plum:#ffffff; --pen:#c2362b; --on-pen:#ffffff; --hl:#ffe08a;
  --su:#2360a8; --pr:#55357a; --ob:#2a7a4c; --co:#9a5f12; --at:#177486; --ad:#a53674; --in:#6b6574;
  --f-ui:"OHJ","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --f-body:"OHJ","Gowun Batang","AppleMyungjo","Batang","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-pen:"Nanum Pen Script","Gowun Batang",cursive;
  interpolate-size:allow-keywords;
  --grid:rgba(207,203,214,.45); --ob-soft:#d3e3da; --pen-soft:#f5e1e1; --hl-soft:#feeec4; --hl-hover:#f2e1c8; --bg0:rgba(244,243,246,0);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17151b; --paper:#1f1c25; --ink:#ece8f2; --ink2:#cfc9d9; --mute:#a39cae; --line:#3d3848;
  --plum:#bda0e4; --plum-soft:#2e2639; --on-plum:#17151b; --pen:#ff8d7d; --on-pen:#17151b; --hl:#6b5512;
  --su:#82b4ee; --pr:#c6aaea; --ob:#7fd09f; --co:#e6b36e; --at:#72cddd; --ad:#ec93c3; --in:#a39cae;
  --grid:rgba(61,56,72,.45); --ob-soft:#32403d; --pen-soft:#3e2c31; --hl-soft:#45381b; --hl-hover:#463929; --bg0:rgba(23,21,27,0);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17151b; --paper:#1f1c25; --ink:#ece8f2; --ink2:#cfc9d9; --mute:#a39cae; --line:#3d3848;
  --plum:#bda0e4; --plum-soft:#2e2639; --on-plum:#17151b; --pen:#ff8d7d; --on-pen:#17151b; --hl:#6b5512;
  --su:#82b4ee; --pr:#c6aaea; --ob:#7fd09f; --co:#e6b36e; --at:#72cddd; --ad:#ec93c3; --in:#a39cae;
  --grid:rgba(61,56,72,.45); --ob-soft:#32403d; --pen-soft:#3e2c31; --hl-soft:#45381b; --hl-hover:#463929; --bg0:rgba(23,21,27,0);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-ui)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border-radius:0;appearance:none;margin:0}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

/* 머리 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--ink)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
h1{margin:0;font:700 1rem/1.2 var(--f-ui);letter-spacing:.02em}
h1 small{font:400 .8rem var(--f-ui);color:var(--mute);margin-left:.6em}
.tabwrap{position:relative;margin-left:auto;min-width:0;max-width:100%}
#tabs{position:relative;display:flex;flex-wrap:wrap;gap:6px}
#tabs button{display:inline-flex;align-items:center;gap:.5em;min-height:40px;padding:.3em .8em .3em .45em;border:2px solid var(--ink);background:var(--paper);font-weight:700;cursor:pointer;transition:background .25s,color .25s}
#tabs button .no{border:1.5px solid currentColor;padding:0 .4em;font-size:.8em;line-height:1.4}
#tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
#tabs button:hover:not([aria-current="page"]){background:var(--plum-soft)}

/* 장 */
.sheet{padding-block:26px 40px;display:flex;flex-direction:column;gap:30px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.band{display:inline-flex;align-items:center;gap:.55em;margin:0;background:var(--ink);color:var(--bg);font:700 1.6rem/1.2 var(--f-ui);padding:.3em .8em .3em .45em}
.band .no{border:2px solid currentColor;padding:0 .35em;font-size:.8em}
.lede{margin:0;flex:1 1 20em;min-width:0;font:400 1rem/1.7 var(--f-body);color:var(--ink2);max-width:36em}
h3{margin:0 0 10px;font:700 .8rem/1 var(--f-ui);letter-spacing:.14em;color:var(--mute)}

/* 실험대 */
.lab{position:relative;border:2px solid var(--ink);background:var(--paper)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ctl.sub{border-bottom-style:dashed}
.seg{display:flex;flex-wrap:wrap}
.seg button{min-height:40px;padding:.4em .85em;margin:0 -1.5px -1.5px 0;border:1.5px solid var(--ink);background:var(--paper);font-weight:500;font-size:.875rem;cursor:pointer;transition:background .2s,color .2s}
.seg button:hover{background:var(--plum-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);position:relative}
.seg.sm button{min-height:36px;font-size:.8rem;border-color:var(--mute)}
.seg.sm button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--on-plum)}
.tog{min-height:36px;padding:.35em .9em;border:1.5px solid var(--pen);background:var(--paper);color:var(--pen);font-weight:700;font-size:.82rem;cursor:pointer;transition:background .2s,color .2s}
.tog[aria-pressed="true"]{background:var(--pen);color:var(--on-pen)}
.act{min-height:40px;padding:.4em 1.1em;border:0;background:var(--plum);color:var(--on-plum);font-weight:700;cursor:pointer;margin-left:auto}
.stage{position:relative;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 10px;min-height:7rem;padding:26px 18px 14px;
  background-image:linear-gradient(var(--grid) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,var(--grid) 1px,rgba(0,0,0,0) 1px);background-size:28px 28px}
.tk{--c:var(--line);display:inline-flex;flex-direction:column;align-items:center;gap:5px}
.tk .w{font:700 clamp(1.15rem,4.2vw,1.75rem)/1.25 var(--f-body);padding:2px 4px 4px;border-bottom:3px solid var(--c);white-space:nowrap}
.tk .l{position:relative;z-index:0;font:700 .72rem/1.3 var(--f-ui);color:var(--c);padding:1px 6px}
.tk .l::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:-1;background:var(--c);opacity:.14}
.tk em{font-style:normal;color:var(--pen)}
.tk.su{--c:var(--su)} .tk.pr{--c:var(--pr)} .tk.ob{--c:var(--ob)} .tk.co{--c:var(--co)} .tk.at{--c:var(--at)} .tk.ad{--c:var(--ad)} .tk.in{--c:var(--in)}
.tk.cl .w{background:var(--plum-soft)}
.tk.bk .w{padding-inline:0;border-color:transparent;color:var(--plum);font-weight:400}
.tk.plus .w{border-color:transparent;color:var(--mute);font-weight:400}
.tk.dim .w{color:var(--mute);border-bottom-style:dashed}
.tk.tight{margin-left:-10px}
.tk.ghost{position:absolute;margin:0;pointer-events:none}
.pulse{animation:pulse .9s}
@keyframes pulse{from{background:var(--hl);transform:scale(1.14)}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.cap{margin:0;padding:12px 18px 16px;border-top:1px solid var(--line);font:400 .95rem/1.7 var(--f-body);color:var(--ink2);min-height:4.2em}
.cap b{color:var(--ink)} .cap em{font-style:normal;font-weight:700;color:var(--pen)}
.capin{animation:capin .45s}
@keyframes capin{from{opacity:0;transform:translateY(6px)}}
.note{position:absolute;right:14px;bottom:100%;margin:0 0 3px;font:400 1.55rem/1 var(--f-pen);color:var(--pen);transform:rotate(-3deg);transform-origin:right bottom;white-space:nowrap;pointer-events:none}
/* 시간 축 */
.tl{position:relative;height:74px;margin:8px 24px 0}
.tl::before{content:"";position:absolute;left:0;right:0;top:34px;border-top:2px solid var(--ink)}
.tl .ax{position:absolute;top:40px;font:500 .72rem var(--f-ui);color:var(--mute)} .tl .ax.r{right:0}
.tl .now{position:absolute;left:50%;top:6px;height:56px;border-left:2px dashed var(--pen)}
.tl .now b{position:absolute;top:-4px;left:6px;font:700 .72rem var(--f-ui);color:var(--pen);white-space:nowrap}
.tl .ev{position:absolute;top:26px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:9px;background:var(--plum);transition:left .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1)}
.tl .ev b{position:absolute;top:22px;left:50%;transform:translateX(-50%);font:700 .72rem var(--f-ui);color:var(--plum);white-space:nowrap}

/* 가지 지도 */
.treebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.treebar h3{margin:0;margin-right:auto}
.treewrap{overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.treein{position:relative;width:max-content;min-width:100%;padding:4px 44px 4px 2px}
.treein svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ln{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:1;stroke-linecap:round}
.ln.d1{stroke-width:3} .ln.d2{stroke-width:1.8}
.n{display:flex;align-items:center;gap:36px}
.kids{display:flex;flex-direction:column;gap:5px;flex:none}
.n.closed>.kids{display:none}
.tree>.n>.kids{gap:20px} .tree>.n>.kids>.n>.kids{gap:10px}
.lb{position:relative;display:block;flex:none;text-align:left;font-size:.875rem;line-height:1.5;color:var(--ink);background:none;border:0;padding:2px 4px;max-width:15em;transition:background .2s}
button.lb{cursor:pointer}
button.lb:hover{background:var(--plum-soft)}
.lb .t{font-weight:700}
.lb .d{font-family:var(--f-body);color:var(--ink2)}
.lb .t+.d{margin-left:.45em}
.lb b{color:var(--ink)} .lb u{text-decoration-color:var(--pen);text-decoration-thickness:2px;text-underline-offset:3px}
.lb.root{background:var(--ink);color:var(--bg);padding:10px 14px;font-size:1.15rem;max-width:8.5em}
.lb.root .d{display:block;margin:2px 0 0;font:400 .75rem/1.4 var(--f-ui);color:inherit;opacity:.8}
button.lb.root:hover{background:var(--plum);color:var(--on-plum)}
.lb.grp{border:2px solid var(--ink);background:var(--paper);padding:6px 10px;max-width:10em;font-size:.95rem}
.lb.grp .d{display:block;margin:0;font:400 .75rem/1.4 var(--f-ui);color:var(--mute)}
.lb.key{max-width:13em}
.lb.key .t{display:inline-block;background:var(--kc,var(--plum));color:var(--on-plum);padding:1px 8px}
.lb.key .d{display:block;margin:3px 0 0;font-size:.8rem}
.lb.key.su{--kc:var(--su)} .lb.key.pr{--kc:var(--pr)} .lb.key.ob{--kc:var(--ob)} .lb.key.co{--kc:var(--co)} .lb.key.at{--kc:var(--at)} .lb.key.ad{--kc:var(--ad)} .lb.key.in{--kc:var(--in)}
.lb.br .t{border-bottom:2px solid var(--ink)}
.lb.warn .t{color:var(--pen)} .lb.warn .t::before{content:"※ "}
.lb.leaf{max-width:29em;padding-bottom:3px;border-bottom:1px solid var(--line);font-size:.84rem}
.ex{display:inline-block;font:700 .66rem/1.5 var(--f-ui);border:1px solid var(--mute);color:var(--mute);padding:0 4px;margin:0 5px 0 2px;vertical-align:1px}
.n.closed>.lb::after{content:"+" attr(data-n);position:absolute;left:100%;top:50%;transform:translate(6px,-50%);font:700 .68rem/1.5 var(--f-ui);background:var(--pen);color:var(--on-pen);padding:0 5px}
.mini{min-height:36px;padding:.3em .8em;border:1.5px solid var(--ink);background:var(--paper);font-size:.8rem;font-weight:500;cursor:pointer;transition:background .2s}
.mini:hover{background:var(--plum-soft)}

/* 질문 */
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
details{border:1.5px solid var(--ink);background:var(--paper)}
summary{display:flex;align-items:baseline;gap:.6em;padding:11px 14px;font-weight:700;cursor:pointer;list-style:none;transition:background .2s}
summary::-webkit-details-marker{display:none}
summary::before{content:"Q";flex:none;font:700 .8rem/1.5 var(--f-ui);background:var(--ink);color:var(--bg);padding:0 .45em}
summary::after{content:"답 보기";flex:none;margin-left:auto;font:500 .72rem var(--f-ui);color:var(--pen);white-space:nowrap}
details[open] summary::after{content:"접기"}
summary:hover{background:var(--plum-soft)}
details::details-content{block-size:0;overflow:clip;transition:block-size .4s cubic-bezier(.2,.8,.2,1),content-visibility .4s allow-discrete}
details[open]::details-content{block-size:auto}
details p{margin:0;padding:2px 14px 14px;font:400 .95rem/1.8 var(--f-body);color:var(--ink2)}
details p b{color:var(--ink)} details p u{text-decoration-color:var(--pen);text-decoration-thickness:2px;text-underline-offset:3px}
.foot{padding-block:18px 36px;border-top:1px solid var(--line);font-size:.8rem;color:var(--mute)}

@media (max-width:900px){
  .n{flex-direction:column;align-items:flex-start;gap:6px}
  .kids{margin-left:18px;align-self:stretch} .kids .kids .kids{margin-left:12px} .tree>.n>.kids{gap:14px}
  .treein{width:auto;padding-right:8px}
  .lb,.lb.leaf,.lb.key,.lb.grp,.lb.root{max-width:100%}
  .n.closed>.lb::after{position:static;display:inline-block;margin-left:8px;transform:none;flex:none;align-self:center}
  .qa{grid-template-columns:minmax(0,1fr)}
  .note{position:static;display:block;padding:10px 14px 0;transform:rotate(-1.5deg);white-space:normal}
  .band{font-size:1.35rem} .tabwrap{margin-left:0}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
/* 브랜드 */
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.mark{margin:0;display:inline-block;font:700 .78rem/1.35 var(--f-ui);letter-spacing:.02em;color:var(--on-plum);background:var(--plum);padding:2px 9px}
/* 토큰 추가 */
.tk.mj{margin-left:-6px}
.tk.x{--c:var(--pen)} .tk.x .w{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px}
.tk.ok{--c:var(--ob)}
.tk .l em{font-style:normal;color:var(--pen)}
.legend{gap:6px 14px;padding-block:8px}
.lg{display:inline-flex;align-items:center;gap:6px;font:500 .78rem/1.4 var(--f-ui);color:var(--ink2)}
.lg::before{content:"";width:18px;height:4px;background:var(--c)}
.lg.su{--c:var(--su)} .lg.pr{--c:var(--pr)} .lg.ob{--c:var(--ob)} .lg.co{--c:var(--co)} .lg.at{--c:var(--at)} .lg.ad{--c:var(--ad)} .lg.in{--c:var(--in)}

/* 확인 문제 */
.quiz{border:2px solid var(--ink);background:var(--paper)}
.qhint{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--mute)}
ol.qs{margin:0;padding:0;list-style:none;counter-reset:q}
.q{counter-increment:q;position:relative;padding:12px 14px 14px 3.1em;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q::before{content:counter(q);position:absolute;left:12px;top:15px;min-width:1.9em;text-align:center;font:700 .72rem/1.5 var(--f-ui);border:1.5px solid var(--ink)}
.qs-s{margin:0;font:400 1.08rem/1.8 var(--f-body)}
.qs-s u{text-decoration-color:var(--pen);text-decoration-thickness:2.5px;text-underline-offset:4px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{min-height:40px;min-width:5.5em;padding:.3em .9em;border:1.5px solid var(--ink);background:var(--paper);font-weight:500;font-size:.9rem;cursor:pointer;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){background:var(--plum-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ob);background:var(--ob-soft);font-weight:700}
.opt.right::before{content:"○ ";color:var(--ob)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft);text-decoration:line-through;-webkit-text-decoration-color:var(--pen);text-decoration-color:var(--pen)}
.opt:disabled:not(.right):not(.wrong):not(.miss){opacity:.45}
.opt.multi[aria-pressed="true"]:not(:disabled){background:var(--plum-soft);border-color:var(--plum);font-weight:700}
.opt.multi[aria-pressed="true"]:not(:disabled)::before{content:"✓ ";color:var(--plum)}
.opt.miss{border-color:var(--ob);border-style:dashed;background:var(--paper)}
.opt.miss::before{content:"놓침 ";font:700 .7rem var(--f-ui);color:var(--ob)}
.chk{min-height:40px;padding:.3em 1em;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;font-size:.9rem;cursor:pointer}
.chk:disabled{opacity:.35;cursor:default}
.exp .trap{font:700 .72rem/1.5 var(--f-ui);color:var(--paper);background:var(--pen);padding:1px 6px;margin-right:4px}
.exp .tip b{font:700 .68rem/1 var(--f-ui);color:var(--plum);vertical-align:super;margin:0 2px}

.exp{margin:8px 0 0;font:400 .93rem/1.75 var(--f-body);color:var(--ink2)}
.exp b{color:var(--ink)} .exp em{font-style:normal;font-weight:700;color:var(--pen)} .exp em.ok{color:var(--ob)}
@media (max-width:900px){.q{padding-left:2.9em;padding-right:10px}}
.exp a.dict{display:inline-flex;align-items:center;min-height:36px;margin-top:6px;padding:.2em .8em;border:1.5px solid var(--plum);color:var(--plum);font:700 .8rem/1.4 var(--f-ui);text-decoration:none}
.exp a.dict:hover{background:var(--plum-soft)}
.exp a.dict{display:flex;width:max-content;max-width:100%}
.exp .tip{display:block;margin-top:8px;padding:8px 10px;background:var(--plum-soft);border-left:3px solid var(--plum);color:var(--ink2)}
.exp .tip i{font-style:normal;font:700 .72rem/1.5 var(--f-ui);color:var(--on-plum);background:var(--plum);padding:1px 6px;margin-right:6px}
.exp .tip b{color:var(--ink)}
/* 빈칸 확인 */
.hint{margin:0 0 8px;font-size:.82rem;color:var(--mute)}
.cnt{font:700 .8rem/1.6 var(--f-ui);color:var(--mute);padding:.15em .6em;border:1.5px solid var(--line);font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.cnt.done{color:var(--on-pen);background:var(--pen);border-color:var(--pen)}
ol.blanks{margin:0;padding:0;list-style:none;counter-reset:b;border:2px solid var(--ink);background:var(--paper)}
.blanks li{counter-increment:b;position:relative;padding:10px 14px 10px 3.1em;border-bottom:1px solid var(--line);font:400 1rem/2.05 var(--f-body);color:var(--ink)}
.blanks li:last-child{border-bottom:0}
.blanks li::before{content:counter(b);position:absolute;left:12px;top:15px;min-width:1.9em;text-align:center;font:700 .72rem/1.5 var(--f-ui);border:1.5px solid var(--ink)}
.blank{display:inline-block;min-width:3.2em;min-height:34px;margin:0 2px;padding:0 .45em;border:0;border-bottom:2.5px solid var(--pen);background:var(--plum-soft);font:700 1rem/34px var(--f-body);cursor:pointer;vertical-align:middle;transition:background .2s}
.blank span{visibility:hidden}
.blank:hover{background:var(--hl-hover)}
.blank.on{background:var(--hl-soft)}
.blank.on span{visibility:visible;color:var(--pen)}
.pop{animation:pop .45s}
@keyframes pop{from{transform:scale(1.15)}}
@media (max-width:900px){
  .topin{gap:8px}
  .tabwrap{width:calc(100% + 32px);margin-left:-16px;margin-right:-16px}
  #tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 16px 2px;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{flex:none;min-height:44px}
  h1 small{display:block;margin:2px 0 0}
  .sheet{padding-block:20px 32px;gap:26px}
  .stage{padding:22px 12px 12px;gap:14px 8px}
  .ctl{padding:10px 12px}
  .cap{padding:12px 14px 14px}
  .blanks li{padding-left:2.9em;padding-right:10px}
}

/* ── 모바일 보강 (터치 44px, 바로가기, 기록, 맨 위로) ── */
button,summary,a{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,0)}
#tabs button,.seg button,.seg.sm button,.tog,.act,.mini,.opt,.chk,.exp a.dict{min-height:44px}
summary{min-height:44px;align-items:center}
.blank{position:relative}
.blank::after{content:"";position:absolute;left:-2px;right:-2px;top:-5px;bottom:-5px}
button.lb{min-height:44px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;padding-top:6px;padding-bottom:6px}
.lb.key .d,.lb.grp .d,.lb.root .d{flex-basis:100%}
.lb .t+.d{margin-left:.45em}
.lb.key .t+.d,.lb.grp .t+.d,.lb.root .t+.d{margin-left:0}
.tabwrap::before,.tabwrap::after{position:absolute;top:0;bottom:2px;width:34px;display:flex;align-items:center;font:700 1.3rem/1 var(--f-ui);color:var(--pen);pointer-events:none;opacity:0;transition:opacity .25s;z-index:1}
.tabwrap::before{content:"‹";left:0;justify-content:flex-start;padding-left:3px;background:linear-gradient(to left,var(--bg0),var(--bg) 65%)}
.tabwrap::after{content:"›";right:0;justify-content:flex-end;padding-right:3px;background:linear-gradient(to right,var(--bg0),var(--bg) 65%)}
.tabwrap.l::before,.tabwrap.r::after{opacity:1}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 0}
.jump button{min-height:44px;padding:.3em .85em;border:1.5px solid var(--ink);background:var(--paper);font:500 .85rem/1.3 var(--f-ui);cursor:pointer}
.jump button:hover{background:var(--plum-soft)}
.jump button::before{content:"↓ ";color:var(--pen)}
details.rec{border-style:dashed}
details.rec summary::before{content:"기록"}
details.rec summary::after{content:"펼치기"}
details.rec[open] summary::after{content:"접기"}
details.rec summary span{font:500 .85rem/1.4 var(--f-ui)}
.recbody{padding:2px 14px 14px;font:400 .85rem/1.6 var(--f-ui);color:var(--ink2)}
.recbody table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.recbody th,.recbody td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.recbody th{font-weight:700;color:var(--mute);font-size:.75rem}
.recbody tr.cur td{font-weight:700;color:var(--ink)}
.recbody .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.recbody .warn{color:var(--pen);font-weight:700}
.mini.danger{border-color:var(--pen);color:var(--pen)}
.mini.danger.arm{background:var(--pen);color:var(--on-pen)}
.q::before{content:attr(data-no)}
.qmsg{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;font-weight:700;color:var(--pen)}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.totop{position:fixed;right:16px;bottom:16px;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;width:48px;height:48px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 .72rem/1.1 var(--f-ui);cursor:pointer;box-shadow:0 2px 0 var(--ink);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.totop.on{opacity:1;visibility:visible}
.totop b{display:block;font-size:1.1rem;line-height:1}
/* 실험대: 조사와 앞말, 형태소 묶음이 줄 바꿈으로 갈라지지 않게 */
.glue{display:inline-flex;flex-wrap:nowrap;align-items:flex-start;max-width:100%}
.glue.wrap{flex-wrap:wrap;row-gap:10px}
.glue>.tk.tight,.glue>.tk.mj{margin-left:0}
.glue>.tk+.tk.mj{margin-left:4px}
.glue>.tk.bk+.tk,.glue>.tk+.tk.bk{margin-left:2px}
.stage{overflow:hidden}
.tk .w{max-width:100%}
/* 화면이 아주 좁을 때 */
@media (max-width:360px){
  .band{font-size:1.2rem}
  .tk .w{font-size:1.1rem}
  .q{padding-left:2.6em}
  .blanks li{padding-left:2.6em}
}
/* flex gap을 지원하지 않는 옛 브라우저 */
@supports not (aspect-ratio:1/1){
  .opts>*,.jump>*,.recbody .btns>*{margin:0 6px 6px 0}
  #tabs>button{margin-right:6px}
  .stage>*{margin:0 10px 14px 0}
  .ctl>*{margin:0 10px 6px 0}
  .kids>.n{margin-bottom:6px}
  .treebar>*{margin-right:8px}
  .topin>*{margin-bottom:8px}
  .sheet>*{margin-bottom:26px}
}

const QA=[[
 ['품사는 무엇을 기준으로 나누나?','세 가지다. <b>형태</b>(모양이 변하는가)로 불변어와 가변어, <b>기능</b>(문장에서 무슨 일을 하는가)으로 체언, 용언, 수식언, 관계언, 독립언, <b>의미</b>(무엇을 나타내는가)로 명사부터 감탄사까지 아홉 품사로 나눈다.'],
 ['‘이다’는 조사인데 왜 모양이 바뀌나?','‘이다’는 체언에 붙어 서술어가 되게 하는 <b>서술격 조사</b>다. “학생<u>이다</u>, 학생<u>이고</u>, 방학<u>인가</u>”처럼 활용한다. 조사 가운데 활용하는 것은 ‘이다’ 하나뿐이다. 그래서 <b>기능</b>으로는 관계언이지만 <b>형태</b>로는 가변어이고, 불변어인 조사에서는 제외한다.'],
 ['관형사 ‘새’와 형용사 ‘새롭다’는 어떻게 다른가?','관형사 ‘새’는 형태가 변하지 않고 체언 앞에서 꾸미기만 한다. 형용사 ‘새롭다’는 “새롭고, 새로운, 새로워서”처럼 활용하고 서술어도 될 수 있다. 예문 ⑦의 ‘깊은’도 ‘깊다’가 활용한 꼴이라 형용사다.'],
 ['보조사는 어떻게 알아보나?','두 가지를 확인한다. 첫째, 빼거나 격 조사로 바꿔도 문장의 자격은 그대로이고 뜻만 달라진다. “나<u>도</u> 간다”를 “내<u>가</u> 간다”로 바꾸면 ‘역시’라는 뜻만 사라진다. 둘째, 부사나 어미 뒤에도 붙는다. “빨리<u>도</u> 간다”, “먹어<u>는</u> 보았다”처럼 체언이 아닌 말 뒤에 붙은 조사는 보조사다.'],
 ['품사 통용은 어떻게 판단하나?','단어 모양이 아니라 <b>문장 속 쓰임</b>을 여러 단서로 함께 본다. 격 조사가 붙어 주어나 목적어가 되면 체언일 가능성이 크다(“<u>오늘</u>이”). 조사 없이 형태 변화도 없이 체언을 꾸미면 관형사(“<u>그</u> 사람”), 조사 없이 용언을 꾸미면 부사(“<u>오늘</u> 간다”)로 볼 수 있다. ‘-ㄴ다’가 자연스러우면 동사(“쑥쑥 <u>큰다</u>”)다. 다만 단서 하나로 단정하면 안 된다. 부사에도 보조사가 붙고(“빨리<u>도</u>”), 체언을 꾸미는 말에는 관형사 말고도 형용사의 활용형(“<u>깊은</u> 위로”)이나 체언 + 조사(“<u>나의</u> 꿈”)가 있다.'],
 ['관형사와 관형어는 같은 말인가?','아니다. <b>관형사</b>는 품사(단어의 갈래)이고 <b>관형어</b>는 문장 성분(문장 속 역할)이다. 관형어 자리에는 관형사(“<u>새</u> 옷”)도 오지만 형용사의 활용형(“<u>깊은</u> 위로”), 체언 + 관형격 조사(“<u>나의</u> 꿈”), 관형절도 온다. 부사와 부사어, 명사와 주어도 같은 방식으로 구별한다.'],
 ['어간은 절대 변하지 않나?','원칙적으로는 변하지 않는 부분이지만 <b>불규칙 활용</b>에서는 어간의 형태가 달라지기도 한다. “돕다 → 도와”(ㅂ 불규칙), “듣다 → 들어”(ㄷ 불규칙)가 그 예다. 어미의 형태가 달라지는 불규칙 활용도 있다.'],
 ['동사와 형용사는 어떻게 구별하나?','현재를 나타내는 ‘-는다/-ㄴ다’를 붙여 본다. “먹<u>는다</u>”는 되지만 “예쁜다”는 안 되므로 ‘먹다’는 동사, ‘예쁘다’는 형용사다. 명령형 ‘-아라/-어라’, 청유형 ‘-자’도 동사에만 자연스럽게 붙는다.']
],[
 ['단어와 형태소는 무엇이 다른가?','단어는 <b>자립</b>해서 쓰이는 단위(조사 포함)이고, 형태소는 <b>뜻</b>을 가진 가장 작은 단위다. ‘새파랗다’는 단어 하나지만 형태소는 ‘새-, 파랗-, -다’ 셋이다.'],
 ['‘먹-’은 실질 형태소인데 왜 의존 형태소인가?','두 기준이 다르기 때문이다. ‘먹-’은 뜻이 실질적이어서 <b>실질</b> 형태소지만, 어미 없이 혼자 쓰이지 못해서 <b>의존</b> 형태소다. 용언의 어간은 모두 의존 형태소이면서 실질 형태소다.'],
 ['‘뛰어놀다’와 ‘오르내리다’는 무엇이 다른가?','둘 다 합성어다. ‘뛰어놀다’는 ‘뛰-’ 뒤에 연결 어미 ‘-어’가 있다. 용언끼리 이을 때 연결 어미를 쓰는 것은 우리말의 일반적인 결합 방식이므로 <b>통사적</b> 합성어다. ‘오르내리다’는 어간 ‘오르-’에 어간 ‘내리-’가 연결 어미 없이 바로 붙어 일반적인 결합 방식에 어긋나므로 <b>비통사적</b> 합성어다. ‘오르내린다’의 형태소는 ‘오르- / 내리- / -ㄴ다’ 셋이다.'],
 ['‘덮밥’은 왜 비통사적 합성어인가?','우리말에서 명사를 꾸미려면 “덮<u>은</u> 밥”처럼 관형사형 어미가 있어야 한다. ‘덮밥’은 어간 ‘덮-’이 어미 없이 명사 ‘밥’에 바로 붙었으므로 우리말의 일반적인 결합 방식에 어긋나는 비통사적 합성어다. ‘접칼’도 같다.']
],[
 ['동음이의어와 다의어는 어떻게 가르나?','뜻 사이에 <b>관련성</b>이 있는지 본다. ‘배[腹], 배[梨], 배[船]’는 관련이 없으니 동음이의어, ‘손’의 여러 뜻은 ‘사람의 손’에서 이어져 나왔으니 다의어다. 사전에서도 동음이의어는 표제어가 따로 있고, 다의어는 한 표제어 아래 뜻 번호로 나뉜다.'],
 ['‘소년’과 ‘할머니’는 반의어인가?','아니다. 반의어는 하나의 의미 자질만 달라야 한다. ‘소년’과 ‘할머니’는 나이와 성별 둘 다 다르다. ‘소년-소녀’는 성별 하나만 다르다.'],
 ['상의어와 하의어는 정해져 있나?','상대적이다. ‘개’는 ‘동물’의 하의어지만 ‘진돗개’의 상의어다. 어느 단어와 견주느냐에 따라 달라진다.'],
 ['유의어는 언제든 바꿔 쓸 수 있나?','아니다. “쉴 <u>틈</u>이 없다”와 “쉴 <u>겨를</u>이 없다”는 둘 다 되지만 “문 틈”을 “문 겨를”로 바꿀 수는 없다. 유의어는 쓰이는 상황과 범위가 다른 경우가 많다.']
],[
 ['구와 절은 어떻게 다른가?','둘 다 단어 둘 이상이 모여 한 성분 노릇을 한다. 차이는 <b>주어와 서술어의 관계</b>다. “(아주 커다란) 나무”의 괄호 안은 그 관계가 없으니 구, “나는 (네가 떠났음을) 알았다”의 괄호 안은 ‘네가 - 떠났음’이 있으니 절이다.'],
 ['“토끼는 앞발이 짧다”는 주어가 둘인가?','문장 전체의 주어는 ‘토끼는’, 서술절 [앞발이 짧다] 속의 주어는 ‘앞발이’다. 절 전체가 ‘토끼는’의 서술어 노릇을 하므로 서술절을 안은문장이다.'],
 ['대등과 종속은 어떻게 가르나?','먼저 연결 어미가 나타내는 <b>의미 관계</b>를 본다. ‘-지만’(대조), ‘-고’(나열)처럼 두 절이 대등하면 대등하게, ‘-아서’(원인), ‘-면’(조건)처럼 앞 절이 뒤 절에 딸리면 종속적으로 이어진문장이다. 앞뒤 절의 순서를 바꿔 보는 것은 <b>보조적인</b> 확인 방법이다. “인내는 쓰지만 열매는 달다”는 바꿔도 뜻이 같고, “비가 와서 땅이 젖었다”는 바꾸면 뜻이 달라진다.'],
 ['‘-아서/-어서’가 있으면 부사절인가, 이어진문장인가?','문장 전체의 구조와 그 절의 기능으로 판단한다. “길이 [비가 와서] 질다”처럼 ‘-아서/-어서’ 절이 다른 절 <b>안에</b> 들어 있고 부사어 역할을 하면 <b>부사절</b>이다. “비가 와서 땅이 젖었다”처럼 앞 절과 뒤 절을 원인·이유로 이으면 <b>종속적으로 이어진문장</b>이다. 어미의 모양만 보고 정하지 않는다.'],
 ['‘-음, -기’가 붙은 말은 모두 명사절인가?','아니다. 명사형 어미가 붙었는지, 명사를 만드는 접미사가 붙었는지 가려야 한다. 사전에 명사로 올라 있는지, 주어가 겉으로 드러나 있는지만으로 단정하지 않는다. 주어는 생략될 수 있으므로 문맥 속에서 <b>서술성</b>이 있는지를 중심으로 본다. “동생이 빨리 달리기를 바란다”의 ‘달리기’는 주어 ‘동생이’와 부사어 ‘빨리’를 거느리고 서술하므로 명사절의 서술어다. “동생은 달리기를 잘한다”의 ‘달리기’는 서술 기능이 없는 명사다. 앞에 관형어(“큰 웃음”)가 오면 명사, 부사어(“크게 웃음”)가 오면 서술 기능이 살아 있다고 보면 된다.'],
 ['인용절의 ‘라고’와 ‘고’는 무엇인가?','둘 다 인용의 <b>부사격 조사</b>다. 남의 말을 그대로 옮기면 ‘라고’(직접 인용), 말하는 이의 입장으로 바꿔 옮기면 ‘고’(간접 인용)를 쓴다. 인용절은 문장에서 부사어 역할을 한다.']
],[
 ['‘깍두기’는 [깍뚜기]로 소리 나는데 왜 ‘두’로 쓰나?','ㄱ, ㅂ 받침 뒤에서는 된소리가 늘 규칙적으로 나기 때문에 굳이 된소리로 적지 않는다(제5항 다만). 단, “딱딱, 쌕쌕, 씁쓸하다”처럼 같거나 비슷한 음절이 겹치면 된소리로 적는다.'],
 ['‘비율’과 ‘성공률’은 왜 다르게 쓰나?','모음이나 ㄴ 받침 뒤에서만 ‘율’로 적는다. ‘비(모음)’ 뒤라서 비율, ‘백분(ㄴ)’ 뒤라서 백분율이다. ‘성공’은 ㅇ 받침, ‘합격’은 ㄱ 받침이라 본음대로 성공률, 합격률이다.'],
 ['보조 용언은 언제 꼭 띄어 써야 하나?','보조 용언은 띄어 쓰는 것이 원칙이고, 경우에 따라 붙여 쓰는 것도 허용한다(“꺼져 간다/꺼져간다”). 그러나 앞말에 조사가 붙으면(“읽어<u>도</u> 보고”), 앞말이 합성 용언이면(“<u>덤벼들어</u> 보아라”), 중간에 조사가 들어가면(“올 듯<u>도</u> 하다”) 반드시 띄어 쓴다(제47항 다만).'],
 ['한자어끼리 합친 말에도 사이시옷을 쓰나?','원칙적으로 쓰지 않는다. 두 음절 한자어 가운데 ‘곳간, 셋방, 숫자, 찻간, 툇간, 횟수’ 여섯만 예외다. 그래서 [초쩜]으로 소리 나도 ‘초점’, [대까]로 소리 나도 ‘대가’로 적는다.'],
 ['‘나았다, 낳았다, 났다’는 어떻게 가르나?','병이나 상처가 고쳐지면 ‘낫다’ → 나았다. 아이, 새끼, 알을 몸 밖으로 내놓거나 어떤 결과를 이루면 ‘낳다’ → (알을) 낳았다. ‘낳다’는 목적어가 필요한 타동사다. 무엇이 솟아나거나 생기거나 신문에 실리면 ‘나다’ → 났다.']
]];

/* ───────── 문장 토큰 변환 ───────── */
function morph(st,toks){
  const sr=st.getBoundingClientRect(),old=new Map();
  st.querySelectorAll('.tk[data-k]').forEach(e=>old.set(e.dataset.k,[e,e.getBoundingClientRect()]));
  const els=toks.map(([k,w,c,l])=>{
    const hit=old.get(k),e=hit?hit[0]:h('span'),sig=w+'|'+(l||'');
    old.delete(k);
    const chg=e.dataset.s!==sig;
    e.getAnimations().forEach(a=>a.cancel());
    e.dataset.k=k;e.dataset.s=sig;e.className='tk '+(c||'');e.style.left=e.style.top='';
    if(chg)e.innerHTML='<span class="w">'+w+'</span>'+(l?'<span class="l">'+l+'</span>':'');
    e._from=hit?hit[1]:null;e._chg=chg&&!!hit;
    return e});
  const gone=[...old.values()];
  gone.forEach(([e,r])=>{e.getAnimations().forEach(a=>a.cancel());delete e.dataset.k;e.classList.add('ghost');
    e.style.left=(r.left-sr.left-st.clientLeft)+'px';e.style.top=(r.top-sr.top-st.clientTop)+'px'});
  /* 조사·형태소·괄호를 앞말과 한 덩어리로 묶어 줄 바꿈에서 떨어지지 않게 한다 */
  const out=[];let open=null;
  els.forEach((e,i)=>{
    const c=' '+e.className+' ',w=toks[i][1],bk=c.indexOf(' bk ')>=0,mj=c.indexOf(' mj ')>=0;
    const left=c.indexOf(' tight ')>=0||mj||(bk&&w===']');
    if(open){open.append(e);if(mj)open.classList.add('wrap');if(!(bk&&w==='['))open=null;return}
    if(left&&out.length){let L=out[out.length-1];if(!L.classList.contains('glue')){const G=h('span','glue');G.append(L);out[out.length-1]=L=G}L.append(e);if(mj)L.classList.add('wrap');return}
    if(bk&&w==='['){const G=h('span','glue');G.append(e);out.push(G);open=G;return}
    out.push(e);
  });
  st.replaceChildren(...out,...gone.map(g=>g[0]));
  gone.forEach(([e])=>{const a=e.animate([{opacity:1},{opacity:0,transform:'translateY(1.2rem) rotate(5deg)'}],{duration:T(360),easing:'ease-in',fill:'forwards'});
    let done=false;const rm=()=>{if(!done){done=true;e.remove()}};a.onfinish=rm;setTimeout(rm,T(360)+400)});
  let ni=0;
  els.forEach(e=>{
    if(e._from){
      const r=e.getBoundingClientRect(),dx=e._from.left-r.left,dy=e._from.top-r.top;
      if(Math.abs(dx)+Math.abs(dy)>.5)e.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:T(620),easing:EASE});
      if(e._chg)again(e.firstChild,'pulse');
    }else e.animate([{opacity:0,transform:'translateY(-1rem) scale(.85)'},{opacity:1,transform:'none'}],{duration:T(460),delay:T(140+ni++*70),easing:EASE,fill:'backwards'});
  });
}

function seg(names,on,cls){

  names.forEach((nm,i)=>{const b=h('button',null,nm);b.type='button';b.setAttribute('aria-pressed',i===0);b.onclick=()=>{g.pick(i);on(i)};g.append(b)});
  g.pick=i=>[...g.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  return g;
}

/* ───────── 빈칸 확인 ───────── */
function blanks(wrap,list,S){
  const bar=h('div','treebar','<h3>빈칸 확인</h3>'),cnt=h('span','cnt');
  const bo=h('button','mini','모두 보기'),bc=h('button','mini','다시 가리기');bo.type=bc.type='button';
  bar.append(cnt,bo,bc);
  const ol=h('ol','blanks');const all=[];
  const rec=()=>DB.b(S.id);
  const upd=()=>{const n=all.filter(b=>b.classList.contains('on')).length;cnt.textContent=n+' / '+all.length;cnt.classList.toggle('done',n===all.length);S.bOn=n;S.bAll=all.length};
  const set=(b,on)=>{b.classList.toggle('on',on);b.setAttribute('aria-label',on?'답: '+b._a:'빈칸, 눌러서 답 보기');b.setAttribute('aria-pressed',on);if(on)rec()[b._k]=1;else delete rec()[b._k]};
  list.forEach(s=>{
    const li=h('li');let k=0;
    s.split(/(\{[^}]+\})/).forEach(p=>{
      if(p[0]==='{'){
        const a=p.slice(1,-1),b=h('button','blank','<span>'+a+'</span>');b.type='button';b._a=a;b._k=s+'#'+(k++);
        b.onclick=()=>{const on=!b.classList.contains('on');set(b,on);if(on)again(b,'pop');DB.save();upd();refreshRec()};
        all.push(b);li.append(b);
      }else li.append(document.createTextNode(p));
    });
    ol.append(li);
  });
  const load=()=>{const r=rec();all.forEach(b=>set(b,!!r[b._k]));upd()};
  const setAllB=on=>{all.forEach(b=>set(b,on));DB.save();upd();refreshRec()};
  bo.onclick=()=>setAllB(true);bc.onclick=()=>setAllB(false);
  wrap.append(bar,h('p','hint','빈칸을 누르면 답이 나온다. 다시 누르면 가려진다. 확인한 빈칸은 이 기기에 기억된다.'),ol);load();
  S.reloadBlanks=load;
}

/* ───────── 가지 지도 ───────── */
function buildTree(S,data){
  S.labs=[];S.links=[];
  const mk=(nd,dp,par)=>{
    const n=h('div','n'),kids=nd.c;
    const lb=h(kids?'button':'div','lb '+(nd.t?(dp?(nd.k||'br'):'root'):'leaf'),
      (nd.t?'<span class="t">'+nd.t+'</span>':'')+(nd.d?'<span class="d">'+fmt(nd.d)+'</span>':''));
    lb._dp=dp;n.append(lb);S.labs.push(lb);
    if(par){const p=document.createElementNS(NS,'path');p.setAttribute('pathLength','1');p.setAttribute('class','ln d'+dp);S.svg.append(p);S.links.push({a:par,c:lb,p})}
    if(kids){
      lb.type='button';lb.setAttribute('aria-expanded','true');lb.dataset.n=kids.length;
      const k=h('div','kids');kids.forEach(c=>k.append(mk(c,dp+1,lb)));n.append(k);
      lb.onclick=()=>toggle(S,n);
    }
    return n};
  S.tree.append(mk(data,0,null));
}
const r1=n=>Math.round(n*10)/10;
function draw(S){
  if(!S.inner.offsetParent)return;
  const o=S.inner.getBoundingClientRect(),v=MQV.matches;
  for(const L of S.links){
    if(!L.c.offsetParent){L.p.style.display='none';continue}
    L.p.style.display='';
    const a=L.a.getBoundingClientRect(),b=L.c.getBoundingClientRect();let d;
    if(v){
      const ind=b.left-a.left,off=Math.max(4,Math.min(12,ind-8)),x0=r1(a.left-o.left+off),y0=r1(a.bottom-o.top),x1=r1(b.left-o.left),y1=r1(b.top-o.top+Math.min(b.height/2,22)),rr=Math.max(2,Math.min(8,x1-x0-2));
      d=`M${x0} ${y0}V${y1-rr}Q${x0} ${y1} ${x0+rr} ${y1}H${x1}`;
    }else{
      const x0=r1(a.right-o.left),y0=r1(a.top-o.top+a.height/2),x1=r1(b.left-o.left),y1=r1(b.top-o.top+b.height/2),m=r1((x1-x0)/2);
      d=`M${x0} ${y0}C${x0+m} ${y0} ${x1-m} ${y1} ${x1} ${y1}`;
    }
    L.p.setAttribute('d',d);
  }
}
function track(S,ms){
  const end=performance.now()+ms;cancelAnimationFrame(S.raf);
  (function f(){draw(S);if(performance.now()<end)S.raf=requestAnimationFrame(f)})();
}
function enter(S,labs,base=0){
  const set=new Set(labs);let max=0;
  labs.forEach(l=>{
    const dl=(l._dp-base)*T(110);max=Math.max(max,dl);
    l.animate([{opacity:0,transform:MQV.matches?'translateY(-8px)':'translateX(-18px)'},{opacity:1,transform:'none'}],{duration:T(420),delay:dl,easing:EASE,fill:'backwards'});
  });
  S.links.forEach(L=>{if(set.has(L.c))L.p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:T(480),delay:Math.max(0,(L.c._dp-base)*T(110)-T(60)),easing:'ease-out',fill:'backwards'})});
  track(S,max+T(520)+120);
}
function toggle(S,n){
  const lb=n.firstChild,open=n.classList.contains('closed');
  const before=new Map(S.labs.filter(l=>l.offsetParent).map(l=>[l,l.getBoundingClientRect()]));
  n.classList.toggle('closed',!open);lb.setAttribute('aria-expanded',open);
  const fresh=[];
  S.labs.forEach(l=>{
    if(!l.offsetParent)return;
    const b=before.get(l);if(!b){fresh.push(l);return}
    const r=l.getBoundingClientRect(),dx=b.left-r.left,dy=b.top-r.top;
    if(Math.abs(dx)+Math.abs(dy)>.5)l.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:T(440),easing:EASE});
  });
  enter(S,fresh,lb._dp+1);track(S,T(1300)+120);
}
function initTree(S){
  S.tree.querySelectorAll('button.lb').forEach(lb=>{const o=lb._dp<2;lb.parentNode.classList.toggle('closed',!o);lb.setAttribute('aria-expanded',o)});
}
function setAll(S,open){
  S.tree.querySelectorAll('button.lb').forEach(lb=>{const o=open||lb._dp===0;lb.parentNode.classList.toggle('closed',!o);lb.setAttribute('aria-expanded',o)});
  enter(S,S.labs.filter(l=>l.offsetParent));
}

  {s:'그는 편지는커녕 제 이름<u>조차</u> 못 쓴다.',t:'사전 유의어 ‘마저’로 바꿔 보자. → 제 이름<b>마저</b> 못 쓴다.',o:GJ,a:2,d:['조차','조차','조사'],e:'예상하기 어려운 극단의 경우까지 포함함을 나타내는 <b>보조사</b>다.'},
  {s:'비가 많이<u>는</u> 오지 않았다.',t:'‘는’을 빼도 문장이 된다. → 비가 많이 오지 않았다. 빼도 되는 조사는 보조사일 때가 많다.',o:GJ,a:2,d:['는','는','조사'],e:'부사 ‘많이’ 뒤에 붙었다. 격 조사는 주로 체언 뒤에서 자격을 주지만, <b>보조사</b>는 부사나 어미 뒤에도 붙어 뜻을 더한다.'},
  {s:'물이 얼면 얼음<u>이</u> 된다.',t:'‘으로’로 바꾸면 성분이 달라진다. → 얼음<b>으로</b> 된다(부사어). ‘되다’ 앞의 ‘이/가’만 보격 조사다.',o:GJ,a:0,d:['이','이','조사'],e:'‘되다’ 앞에서 바뀌게 되는 대상을 나타낸다. 앞말이 보어임을 나타내는 <b>보격 조사</b>, 곧 격 조사다.'},
  {s:'나를 알아주는 사람은 너<u>밖에</u> 없다.',t:'사전 뜻풀이 ‘그것 말고’로 풀어 보자. → 너 <b>말고는</b> 없다.',o:GJ,a:2,d:['밖에','밖에','조사'],e:'‘그것 말고, 그것 이외에’의 뜻을 나타내는 <b>보조사</b>다. 뒤에 부정의 말이 따른다. “문 밖에 있다”의 ‘밖에’는 명사 ‘밖’ + 조사 ‘에’라서 다르다.'},
  {s:'동생도 형<u>만큼</u> 똑똑하다.',t:'사전 유의어 ‘만치’, 참고어 ‘처럼’으로 바꿔 보자. → 형<b>만치</b> / 형<b>처럼</b> 똑똑하다.',o:GJ,a:[0,2],d:['만큼','만큼고','조사 · 고려대 한국어대사전'],e:'체언 ‘형’에 붙어 비교 대상과 거의 비슷한 정도임을 나타낸다. <b>고려대 한국어대사전</b>은 <b>보조사</b>로, 표준국어대사전은 <b>격 조사</b>로 분류한다. 그래서 둘 다 정답으로 했다. 학교 시험에서는 선생님이 정한 기준을 따르자.'}]},
 {name:'품사 통용 및 형태가 같은 문법 요소의 구별',hint:'같은 단어도 문장 속 쓰임에 따라 품사가 달라진다. 조사가 붙는지, 무엇을 꾸미는지, 활용하는지 함께 보자. 대체로 체언 뒤에 붙여 쓰면 조사, 관형어 뒤에 띄어 쓰면 의존 명사, 용언 어간에 붙으면 어미다. 조사는 자격을 주면 격 조사, 뜻을 더하면 보조사로 골라 보자. 예문은 표준국어대사전(네이버 국어사전)에서 가져왔다.',items:[
  {s:'<u>오늘</u>이 첫 출근 날입니다.',t:'사전 유의어 ‘금일’로 바꿔 보자. → <b>금일</b>이 첫 출근 날입니다. 조사가 그대로 붙는다.',o:['명사','부사'],a:0,d:['오늘','오늘','명사'],e:'격 조사 ‘이’가 붙어 주어로 쓰였다. 격 조사와 결합해 주어가 되는 것은 체언의 특징이다. 체언 가운데 이날을 가리키는 이름이므로 <b>명사</b>다. 조사가 붙었다는 것 하나만으로 명사라고 정하지는 않는다(부사에도 보조사가 붙는다: 빨리도).'},
  {s:'그가 <u>오늘</u> 왔다.',t:'사전 반의어 ‘어제’를 넣어 보자. → 그가 <b>어제</b> 왔다. 조사 없이 ‘왔다’를 꾸미는 자리다.',o:['명사','부사'],a:1,d:['오늘','오늘','부사'],e:'조사 없이 서술어 ‘왔다’를 꾸민다. ‘지금 지나가고 있는 이날에’라는 뜻의 <b>부사</b>다.'},
  {s:'<u>그</u> 책 이리 좀 줘 봐.',t:'‘이, 저’로 바꿔 보자. → <b>저</b> 책. 뒤에 꾸밈받는 체언이 꼭 온다.',o:['대명사','관형사'],a:1,d:['그','그','관형사'],e:'뒤의 명사 ‘책’을 꾸미고 조사가 붙지 않는다. <b>관형사</b>다.'},
  {s:'<u>그</u>는 참으로 좋은 사람이다.',t:'‘그 사람’으로 바꿔 보자. → <b>그 사람</b>은 참으로 좋은 사람이다. 명사구를 대신하니 대명사다.',o:['대명사','관형사'],a:0,d:['그','그','대명사'],e:'보조사 ‘는’이 붙어 주어 자리에 쓰였고, 사람을 가리켜 대신한다. 삼인칭 <b>대명사</b>다.'},
  {s:'사과 <u>다섯</u> 개.',o:['수사','관형사'],a:1,d:['다섯','다섯','관형사'],e:'뒤의 단위 명사 ‘개’를 꾸미고 조사가 붙지 않는다. 수 <b>관형사</b>다.'},
  {s:'둘에 셋을 더하면 <u>다섯</u>이다.',o:['수사','관형사'],a:0,d:['다섯','다섯','수사'],e:'서술격 조사 ‘이다’가 붙었다. 수량을 나타내는 <b>수사</b>다.'},
  {s:'키가 몰라보게 <u>컸</u>구나.',t:'사전 유의어 ‘자라다’로 바꿔 보자. → 키가 몰라보게 <b>자랐</b>구나. 움직임을 나타내는 동사다.',o:['동사','형용사'],a:0,d:['크다','크다','동사'],e:'‘자라다’라는 움직임을 나타낸다. <b>동사</b>다.'},
  {s:'키가 <u>크다</u>.',t:'‘자라다’로 바꾸면 뜻이 달라진다. → 키가 자라다(×같은 뜻). 지금의 상태를 나타내는 형용사다.',o:['동사','형용사'],a:1,d:['크다','크다','형용사'],e:'길이나 높이가 보통 정도를 넘는 <b>상태</b>를 나타낸다. 형용사다.'},
  {s:'대한 독립 <u>만세</u>!',o:['명사','감탄사'],a:1,d:['만세','만세','감탄사'],e:'경축, 환호의 느낌으로 외치는 말이다. <b>감탄사</b>다.'},
  {s:'<u>만세</u>를 부르다.',o:['명사','감탄사'],a:0,d:['만세','만세','명사'],e:'목적격 조사 ‘를’이 붙어 목적어로 쓰였으니 체언이다. 체언 가운데 외치는 행위를 가리키는 이름이므로 <b>명사</b>다.'},
  {s:'모두 <u>같이</u> 갑시다.',t:'사전 유의어 ‘함께’로 바꿔 보자. → 모두 <b>함께</b> 갑시다.',o:['부사','격 조사','보조사'],a:0,d:['같이','같이','부사'],e:'띄어 쓰고 서술어 ‘갑시다’를 꾸민다. ‘함께’라는 뜻의 <b>부사</b>다.'},
  {s:'눈<u>같이</u> 흰 박꽃.',t:'사전 뜻풀이의 ‘처럼’으로 바꿔 보자. → 눈<b>처럼</b> 흰 박꽃. 조사끼리 바뀐다.',o:['부사','격 조사','보조사'],a:1,d:['같이','같이','조사'],e:'체언 ‘눈’에 붙여 쓰고 ‘처럼’의 뜻을 나타낸다. 격 <b>조사</b>다.'},
  {s:'내가 너<u>보다</u> 크다.',t:'사전 뜻풀이 ‘~에 비해서’로 풀어 보자. → 내가 너<b>에 비해서</b> 크다.',o:['부사','격 조사','보조사'],a:1,d:['보다','보다조','조사'],e:'체언에 붙어 비교의 대상을 나타낸다. 격 <b>조사</b>다.'},
  {s:'<u>보다</u> 빠르게 뛰다.',t:'사전 유의어 ‘더, 한층’으로 바꿔 보자. → <b>더</b> 빠르게 뛰다. 부사끼리 바뀐다.',o:['부사','격 조사','보조사'],a:0,d:['보다','보다부','부사'],e:'띄어 쓰고 ‘빠르게’를 꾸민다. ‘한층 더’라는 뜻의 <b>부사</b>다.'},
  {s:'말을 들어 <u>보다</u>.',t:'사전 뜻풀이 ‘시험 삼아 함’을 떠올리자. → 말을 <b>시험 삼아</b> 들어 보다. 본용언 ‘들어’ 뒤에 붙은 보조 동사다.',o:['격 조사','보조사','부사','동사'],a:3,d:['보다','보다동','보조 동사'],e:'본용언 ‘들어’ 뒤에서 ‘시험 삼아 함’을 나타낸다. 보조 <b>동사</b>다.'},
  {s:'<u>아니</u>, 벌써 도착했니?',t:'사전 유의어 ‘세상에’로 바꿔 보자. → <b>세상에</b>, 벌써 도착했니?',o:['부사','감탄사'],a:1,d:['아니','아니감','감탄사'],e:'놀라거나 의아할 때 홀로 쓰는 말이다. <b>감탄사</b>다.'},
  {s:'<u>아니</u> 먹다.',t:'사전 유의어 ‘안’으로 바꿔 보자. → <b>안</b> 먹다.',o:['부사','감탄사'],a:0,d:['아니','아니부','부사'],e:'서술어 ‘먹다’를 부정하며 꾸민다. <b>부사</b>다.'},
  {s:'명주는 무명<u>만큼</u> 질기지 못하다.',t:'사전 유의어 ‘만치’로 바꿔 보자. → 무명<b>만치</b> 질기지 못하다.',o:['격 조사','보조사','의존 명사'],a:[0,1],d:['만큼','만큼','조사'],e:'체언 ‘무명’에 바로 붙어 비슷한 정도를 나타낸다. 조사다. 표준국어대사전은 <b>격 조사</b>로, 고려대 한국어대사전은 <b>보조사</b>로 분류해서 둘 다 정답으로 했다.'},
  {s:'나도 언니<u>만큼</u> 요리를 잘할 수 있다.',t:'사전 유의어 ‘만치’, 참고어 ‘처럼’으로 바꿔 보자. → 언니<b>처럼</b> 요리를 잘할 수 있다.',o:['격 조사','보조사','의존 명사'],a:[0,1],d:['만큼','만큼고','조사 · 고려대 한국어대사전'],e:'체언 ‘언니’에 붙여 쓴다. 비교 대상과 비슷한 정도를 나타내는 조사다. 고려대 한국어대사전은 <b>보조사</b>로, 표준국어대사전은 <b>격 조사</b>로 분류해서 둘 다 정답으로 했다. 앞말이 체언이면 조사, 관형어면 의존 명사다.'},
  {s:'노력한 <u>만큼</u> 대가를 얻다.',t:'사전 뜻풀이의 ‘정도’로 바꿔 보자. → 노력한 <b>정도</b>로 대가를 얻다. 명사끼리 바뀌니 의존 명사다.',o:['격 조사','보조사','의존 명사'],a:2,d:['만큼','만큼','의존 명사'],e:'관형어 ‘노력한’의 꾸밈을 받고 띄어 쓴다. <b>의존 명사</b>다.'},
  {s:'이제 믿을 것은 오직 실력<u>뿐</u>이다.',t:'사전 뜻풀이 ‘그것만이고 더는 없음’으로 풀어 보자. → 믿을 것은 실력<b>만</b> 있다.',o:['격 조사','보조사','의존 명사'],a:1,d:['뿐','뿐조','조사'],e:'체언 ‘실력’에 붙어 ‘그것만이고 더는 없음’을 나타낸다. <b>보조사</b>다.'},
  {s:'모두들 구경만 할 <u>뿐</u> 누구 하나 거드는 이가 없었다.',t:'사전 뜻풀이의 ‘따름’으로 바꿔 보자. → 구경만 할 <b>따름</b>이고… ‘따름’도 의존 명사다.',o:['격 조사','보조사','의존 명사'],a:2,d:['뿐','뿐의','의존 명사'],e:'관형어 ‘할’의 꾸밈을 받고 띄어 쓴다. <b>의존 명사</b>다.'},
  {s:'처벌하려면 법<u>대로</u> 해라.',t:'사전 뜻풀이 ‘근거함’으로 풀어 보자. → 법<b>에 따라</b> 해라.',o:['격 조사','보조사','의존 명사'],a:1,d:['대로','대로조','조사'],e:'체언 ‘법’에 붙어 ‘근거하거나 달라짐이 없음’을 나타낸다. <b>보조사</b>다.'},
  {s:'들은 <u>대로</u> 이야기하다.',t:'사전 뜻풀이 ‘어떤 모양이나 상태와 같이’로 풀어 보자. → 들은 <b>것과 같이</b> 이야기하다.',o:['격 조사','보조사','의존 명사'],a:2,d:['대로','대로의','의존 명사'],e:'관형어 ‘들은’의 꾸밈을 받고 띄어 쓴다. <b>의존 명사</b>다.'},
  {s:'집을 떠나온 <u>지</u> 어언 3년이 지났다.',t:'사전 뜻풀이로 풀어 보자. → 집을 떠나온 <b>때로부터</b> 어언 3년이 지났다. 시간을 나타내면 의존 명사다.',o:['어미','의존 명사'],a:1,d:['지','지','의존 명사'],e:'관형사형 어미 ‘-ㄴ’(떠나온) 뒤에 띄어 쓰고, 어떤 일이 있었던 때부터 지금까지의 <b>동안</b>을 나타낸다. <b>의존 명사</b>다.'},
  {s:'얼마나 부지런한<u>지</u> 세 사람 몫의 일을 해낸다.',t:'‘때로부터’를 넣어 보면 말이 안 된다. → 부지런한 때로부터(×). 시간의 뜻이 없으니 어미다.',o:['어미','의존 명사'],a:0,d:['-ㄴ지','ㄴ지','어미'],e:'‘부지런하-’에 ‘-ㄴ지’가 붙었다. 시간의 뜻이 없는 연결 <b>어미</b>라 붙여 쓴다.'},
  {s:'무엇부터 해야 <u>할지</u> 덤벙거리다 시간만 보냈어.',t:'‘-ㄹ지’는 ‘할지, 올지’처럼 어간에 붙여 쓴다. 시간을 나타내는 의존 명사 ‘지’는 ‘-ㄴ/-은’ 뒤에 띄어 쓰므로 여기서는 어미다.',o:['어미','의존 명사'],a:0,d:['-ㄹ지','ㄹ지','어미'],e:'‘-ㄹ지’는 추측에 대한 막연한 의문을 나타내는 연결 <b>어미</b>다. 시간을 나타내는 의존 명사 ‘지’는 관형사형 어미 ‘-ㄴ/-은’ 뒤에 띄어 쓰이므로, 여기의 ‘-ㄹ지’는 어미다.'},
  {s:'<u>여기</u>가 바로 내 고향이다.',t:'사전 유의어 ‘이곳’으로 바꿔 보자. → <b>이곳</b>이 바로 내 고향이다. 명사를 대신하는 대명사다.',o:['대명사','부사'],a:0,d:['여기','여기','대명사'],e:'조사 ‘가’가 붙어 주어로 쓰였다. 말하는 이에게 가까운 곳을 가리키는 지시 <b>대명사</b>다.'},
  {s:'<u>과학적</u> 사고.',t:'‘과학적인’으로 바꿔도 뜻이 같다. → 과학적<b>인</b> 사고. 이때 ‘과학적인’은 명사 + ‘이다’의 활용형이다.',o:['명사','관형사','부사'],a:1,d:['과학적','과학적','관형사'],e:'조사 없이 바로 뒤의 명사 ‘사고’를 꾸민다. <b>관형사</b>다.'},

const MSK=q=>q.a.reduce((m,k)=>m|1<<k,0);
const OK=(q,k)=>q.m?k===MSK(q):Array.isArray(q.a)?q.a.includes(k):k===q.a;
const qKey=(g,q)=>g.name+'|'+q.s;
/* 저장된 상태를 읽되, 내용이 바뀌어 맞지 않는 값은 버린다 */
function qGet(S,g,q){
  const o=DB.q(S.id)[qKey(g,q)],n=q.o.length,lim=q.m?(1<<n):n;
  if(!o||typeof o!=='object')return{c:-1,p:0};
  const c=(typeof o.c==='number'&&o.c>=0&&o.c<lim&&(!q.m||o.c>0))?o.c:-1;
  const p=(q.m&&typeof o.p==='number'&&o.p>0&&o.p<lim)?o.p:0;
  return{c,p};
}
function qSet(S,g,q,o){const r=DB.q(S.id),k=qKey(g,q);if(o.c<0&&!o.p)delete r[k];else r[k]={c:o.c,p:o.p};DB.save()}
function quizStats(S){
  let all=0,done=0,right=0;
  (QZ[S.i]||[]).forEach(g=>g.items.forEach(q=>{all++;const o=qGet(S,g,q);if(o.c>=0){done++;if(OK(q,o.c))right++}}));
  return{all,done,right};
}
function quiz(wrap,groups,S){
  const bar=h('div','treebar','<h3>확인 문제</h3>'),cnt=h('span','cnt');
  const wr=h('button','mini','틀린 문제만'),rs=h('button','mini','다시 풀기');wr.type=rs.type='button';wr.setAttribute('aria-pressed','false');
  bar.append(cnt,wr,rs);
  const box=h('div','quiz'),hint=h('p','qhint'),msg=h('p','qmsg'),ol=h('ol','qs');msg.hidden=true;
  let gi=0,only=null;
  const score=()=>{const g=groups[gi];let n=0,r=0;g.items.forEach(q=>{const c=qGet(S,g,q).c;if(c>=0){n++;if(OK(q,c))r++}});
    cnt.textContent='맞힘 '+r+' / '+g.items.length;cnt.classList.toggle('done',n===g.items.length)};
  const say=t=>{msg.textContent=t;msg.hidden=!t};
  const render=()=>{
    const g=groups[gi];hint.textContent=g.hint;ol.replaceChildren();
    g.items.forEach((q,j)=>{
      if(only&&!only.has(j))return;
      const li=h('li','q'),ops=h('div','opts'),ex=h('p','exp');li.setAttribute('data-no',j+1);
      li.append(h('p','qs-s',q.s),ops,ex);
      let cur=qGet(S,g,q);
      const chk=h('button','chk','정답 확인');chk.type='button';
      const paint=()=>{const c=cur.c,pick=cur.p;
        [...ops.children].forEach((b,k)=>{
          if(b===chk){b.hidden=c>=0;b.disabled=!pick;return}
          if(q.m){const inA=q.a.includes(k),ch=c>=0&&!!(c>>k&1);
            b.classList.toggle('right',c>=0&&inA&&ch);b.classList.toggle('miss',c>=0&&inA&&!ch);b.classList.toggle('wrong',c>=0&&!inA&&ch);
            b.setAttribute('aria-pressed',c>=0?ch:!!(pick>>k&1));}
          else{b.classList.toggle('right',c>=0&&OK(q,k));b.classList.toggle('wrong',c===k&&!OK(q,k));}
          b.disabled=c>=0});
        ex.hidden=c<0;
        if(c>=0)ex.innerHTML=(OK(q,c)?'<em class="ok">맞았다!</em> ':'<em>아쉽다. 답은 ‘'+[].concat(q.a).map(k=>q.o[k]).join(q.m?'’, ‘':'’ 또는 ‘')+'’.</em> ')+q.e+(q.t?'<span class="tip"><i>'+(q.m?'분석':'바꿔 보기')+'</i>'+q.t+'</span>':'')+(q.d&&ID[q.d[1]]?'<a class="dict" href="https://ko.dict.naver.com/#/entry/koko/'+ID[q.d[1]]+'" target="_blank" rel="noopener">네이버 국어사전 ‘'+q.d[0]+'’ 〔'+q.d[2]+'〕 보기 ↗</a>':'');
        else ex.textContent=''};
      const commit=()=>{qSet(S,g,q,cur);paint();if(cur.c>=0)again(ex,'capin');score();refreshRec()};
      q.o.forEach((o,k)=>{const b=h('button','opt'+(q.m?' multi':''),o);b.type='button';
        b.onclick=q.m?()=>{if(cur.c>=0)return;cur={c:-1,p:cur.p^(1<<k)};qSet(S,g,q,cur);paint()}
                     :()=>{if(cur.c>=0)return;cur={c:k,p:0};commit()};
        ops.append(b)});
      if(q.m){chk.onclick=()=>{if(cur.c>=0||!cur.p)return;cur={c:cur.p,p:0};commit()};ops.append(chk)}
      paint();ol.append(li);
    });
    score();
  };
  const exitOnly=()=>{only=null;wr.textContent='틀린 문제만';wr.setAttribute('aria-pressed','false');say('')};
  wr.onclick=()=>{
    if(only){exitOnly();render();return}
    const g=groups[gi],w=[];
    g.items.forEach((q,j)=>{const c=qGet(S,g,q).c;if(c>=0&&!OK(q,c))w.push(j)});
    if(!w.length){say('지금 틀린 문제가 없다. 아직 풀지 않은 문제부터 풀어 보자.');return}
    w.forEach(j=>qSet(S,g,g.items[j],{c:-1,p:0}));
    only=new Set(w);wr.textContent='전체 문제 보기';wr.setAttribute('aria-pressed','true');
    say('틀렸던 '+w.length+'문제만 다시 풀어 보자. 번호는 원래 번호다.');render();refreshRec();
  };
  rs.onclick=()=>{const g=groups[gi];g.items.forEach(q=>qSet(S,g,q,{c:-1,p:0}));exitOnly();render();refreshRec()};
  box.append(row('',seg(groups.map(g=>g.name),i=>{gi=i;exitOnly();render()})),hint,msg,ol);
  wrap.append(bar,box);render();
  S.reloadQuiz=()=>{exitOnly();render()};
}

function labOH(box,S){
  let i=0,st8=0;
  const st=h('div','stage oh'),cap=h('p','cap'),tg=h('button','act');tg.type='button';
  const btn=['형태소로 나누기','현대어로 풀기','원문으로'];
  const upd=()=>{
    const d=D7[i],toks=[];let n=0;
    if(st8===2)d.gl.split(' ').forEach((w,j)=>toks.push([i+'g'+j,w,'mo']));
    else d.w.forEach(([w,mm],j)=>{
      if(!st8){toks.push([i+'w'+j,w,'']);return}
      mm.forEach(([m,c,l],k)=>{n++;toks.push([i+'w'+j+(k?'m'+k:''),m,c+(k?' mj':''),l])});
    });
    morph(st,toks);
    st.classList.toggle('modern',st8===2);
    setCap(cap,st8===0?'원문이다. 어절 '+d.w.length+'개. ‘형태소로 나누기’를 눌러 프린트 풀이대로 쪼개 보자.':st8===1?'<b>'+n+'개</b>로 나누었다. '+d.note:'<b>현대어 풀이</b>: '+d.gl+'.');
    tg.textContent=btn[st8];
  };
  tg.onclick=()=>{st8=(st8+1)%3;upd()};
  box.append(row('',seg(D7.map(d=>d.name),j=>{i=j;st8=0;upd()}),tg),legend([['su','체언'],['co','조사'],['pr','어간'],['ad','어미'],['in','접사'],['at','그 밖']]),st,cap);
  S.play=()=>{st8=0;st.replaceChildren();upd()};
}

 {id:'jjaim',title:'단어의 짜임',lede:'단어를 더 쪼개면 뜻을 가진 가장 작은 단위, 형태소가 나온다. 어근과 접사가 어떻게 만나는지에 따라 단일어, 합성어, 파생어가 갈린다.',note:'빗금(/)부터 그어 보자!',lt:'형태소 실험대 · 프린트 예문',data:T2,lab:labM},
 {id:'uimi',title:'의미 관계',lede:'단어의 뜻은 홀로 있지 않다. 비슷하거나, 맞서거나, 품고 품기며, 소리 하나에 뜻이 여럿 겹치기도 한다.',note:'뜻끼리 무슨 사이일까?',lt:'단어 실험대',data:T3,lab:labAB(D3,['뜻 풀어 보기','처음으로'])},
 {id:'munjang',title:'문장의 짜임',lede:'주어와 서술어가 몇 번 나타나는지 세면 홑문장과 겹문장이 갈린다. 겹문장은 절을 안거나 절을 잇는다.',note:'주어와 서술어의 관계가 몇 번 나타나는지 확인하자! 본용언과 보조 용언(예: 먹어 버렸다)은 하나의 서술어를 이룰 수 있다.',lt:'문장 실험대 · 프린트 예문',data:T4,lab:lab4},
 {id:'matchum',title:'한글 맞춤법',lede:'표준어를 소리대로 적되 어법에 맞도록 적는다. 헷갈리는 된소리, 두음 법칙, 사이시옷, 띄어쓰기를 직접 고쳐 보자.',note:'틀린 곳에 빨간 줄!',lt:'표기 실험대',data:T5,lab:lab5},
 {id:'jungse',title:'중세 국어',lede:'훈민정음은 상형, 가획, 합성의 원리로 만들었다. 15세기 국어는 글자도, 소리의 높낮이도, 조사의 모양도 지금과 달랐다.',note:'옛 글자는 바꾸지 말고 그대로 읽자!',lt:'결합 실험대 · 프린트 예문',data:T6,lab:labAB(D6,['합쳐 보기','처음으로'])},
 {id:'wonmun',title:'훈민정음 · 용비어천가',lede:'세종어제훈민정음 서문과 용비어천가 1장, 2장, 125장을 원문 그대로 읽고 프린트 풀이대로 쪼개 본다.',note:'원문 → 형태소 → 현대어 순서로!',lt:'원문 실험대',data:T7,lab:labOH}];
const main=document.getElementById('main'),tabs=document.getElementById('tabs'),tabwrap=document.getElementById('tabwrap'),topbar=document.querySelector('.top'),totop=document.getElementById('totop');
let cur=-1;
const BLN=i=>BL[i].reduce((n,s)=>n+(s.match(/\{[^}]+\}/g)||[]).length,0);
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'-';
function scrollToEl(el){
  const y=Math.max(0,el.getBoundingClientRect().top+(window.pageYOffset||0)-topbar.offsetHeight-10);
  try{window.scrollTo({top:y,behavior:RM.matches?'auto':'smooth'})}catch(e){window.scrollTo(0,y)}
}
/* 학습 기록 표 */
function recHTML(i){
  let rows='',tq=0,td=0,tr=0,tb=0,ta=0;
  SH.forEach((S,j)=>{
    const q=quizStats(S),bo=Object.keys(DB.b(S.id)).length,ba=BLN(j);
    tq+=q.all;td+=q.done;tr+=q.right;tb+=Math.min(bo,ba);ta+=ba;
    rows+='<tr'+(j===i?' class="cur"':'')+'><td>'+(j+1)+'. '+S.title+'</td><td>'+(q.all?q.done+' / '+q.all:'문제 없음')+'</td><td>'+(q.all?pct(q.right,q.done):'-')+'</td><td>'+Math.min(bo,ba)+' / '+ba+'</td></tr>';
  });
  rows+='<tr><td><b>전체</b></td><td><b>'+td+' / '+tq+'</b></td><td><b>'+pct(tr,td)+'</b></td><td><b>'+tb+' / '+ta+'</b></td></tr>';
  return '<table><thead><tr><th>단원</th><th>푼 문제</th><th>정답률</th><th>확인한 빈칸</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +(DB.ok?'':'<p class="warn">이 브라우저에서는 기록을 저장할 수 없어 새로고침하면 기록이 사라진다. 학습 기능은 그대로 쓸 수 있다.</p>');
}
function refreshRec(){
  SH.forEach((S,i)=>{
    if(!S.rec)return;const q=quizStats(S),bo=Math.min(Object.keys(DB.b(S.id)).length,BLN(i));
    S.recSum.textContent='내 학습 기록 · '+(q.all?'문제 '+q.done+'/'+q.all+(q.done?' (정답률 '+pct(q.right,q.done)+')':'')+' · ':'')+'빈칸 '+bo+'/'+BLN(i);
    if(S.rec.open)S.recTable.innerHTML=recHTML(i);
  });
}
/* 두 번 눌러야 지워지는 버튼 (실수 방지, 팝업 없이) */
function armBtn(label,fn){
  const b=h('button','mini danger',label);b.type='button';let t=0;
  b.onclick=()=>{if(b.classList.contains('arm')){clearTimeout(t);b.classList.remove('arm');b.textContent=label;fn();return}
    b.classList.add('arm');b.textContent='한 번 더 누르면 지워진다';t=setTimeout(()=>{b.classList.remove('arm');b.textContent=label},3500)};
  return b;
}
SH.forEach((S,i)=>{
  S.i=i;
  const tab=h('button',null,'<span class="no">'+(i+1)+'</span>'+S.title);tab.type='button';tab.onclick=()=>go(i);tabs.append(tab);S.tab=tab;
  const el=h('section','sheet');el.hidden=true;S.el=el;el.id='sheet-'+S.id;
  const head=h('div','head','<h2 class="band"><span class="no">'+(i+1)+'</span>'+S.title+'</h2><p class="lede">'+S.lede+'</p>');
  /* 바로가기 */
  const parts=[['tree','가지 지도'],['bl','빈칸 확인'],...(QZ[i]?[['qz','확인 문제']]:[]),['lab','실험대'],['qa','헷갈리는 질문']];
  const jump=h('nav','jump');jump.setAttribute('aria-label','이 단원 바로가기');
  parts.forEach(([k,t])=>{const b=h('button',null,t);b.type='button';b.onclick=()=>{const t2=document.getElementById(S.id+'-'+k);if(t2)scrollToEl(t2)};jump.append(b)});
  /* 학습 기록 */
  const rec=h('details','rec'),sum=h('summary'),recSum=h('span'),body=h('div','recbody'),tbl=h('div'),btns=h('div','btns');
  sum.append(recSum);rec.append(sum,body);body.append(tbl,btns);
  btns.append(armBtn('이 단원 기록 지우기',()=>{DB.clear(S.id);S.reloadQuiz&&S.reloadQuiz();S.reloadBlanks&&S.reloadBlanks();refreshRec()}),
              armBtn('전체 기록 지우기',()=>{DB.clearAll();SH.forEach(X=>{X.reloadQuiz&&X.reloadQuiz();X.reloadBlanks&&X.reloadBlanks()});refreshRec()}));
  rec.addEventListener('toggle',()=>{if(rec.open)tbl.innerHTML=recHTML(i)});
  S.rec=rec;S.recSum=recSum;S.recTable=tbl;
  const blWrap=h('div');blWrap.id=S.id+'-bl';blanks(blWrap,BL[i],S);
  const qzWrap=h('div');qzWrap.id=S.id+'-qz';if(QZ[i])quiz(qzWrap,QZ[i],S);
  const labWrap=h('div',null,'<h3>'+S.lt+'</h3>'),box=h('div','lab');labWrap.id=S.id+'-lab';
  box.append(h('p','note',S.note));S.lab(box,S);labWrap.append(box);
  const treeWrap=h('div'),bar=h('div','treebar','<h3>가지 지도</h3>');treeWrap.id=S.id+'-tree';
  const bo=h('button','mini','모두 펼치기'),bc=h('button','mini','모두 접기');bo.type=bc.type='button';
  bo.onclick=()=>setAll(S,true);bc.onclick=()=>setAll(S,false);bar.append(bo,bc);
  const tw=h('div','treewrap');S.inner=h('div','treein');
  S.svg=document.createElementNS(NS,'svg');S.svg.setAttribute('aria-hidden','true');
  S.tree=h('div','tree');S.inner.append(S.svg,S.tree);tw.append(S.inner);
  treeWrap.append(bar,h('p','hint','큰 갈래만 펼쳐 두었다. 가지를 누르면 아래 내용이 펼쳐진다.'),tw);
  buildTree(S,S.data);initTree(S);
  const qaWrap=h('div',null,'<h3>헷갈리는 질문</h3>'),qa=h('div','qa');qaWrap.id=S.id+'-qa';
  QA[i].forEach(([q,a])=>qa.append(h('details',null,'<summary><span>'+q+'</span></summary><p>'+a+'</p>')));
  qaWrap.append(qa);
  el.append(head,jump,rec,treeWrap,blWrap,...(QZ[i]?[qzWrap]:[]),labWrap,qaWrap);main.append(el);
  if(window.ResizeObserver)new ResizeObserver(()=>draw(S)).observe(S.inner);
});
if(!window.ResizeObserver)addEventListener('resize',()=>SH.forEach(draw));
refreshRec();
/* 단원 메뉴: 선택한 단원을 가운데로, 좌우에 더 있음을 표시 */
function fade(){const l=tabs.scrollLeft,m=tabs.scrollWidth-tabs.clientWidth;tabwrap.classList.toggle('l',l>4);tabwrap.classList.toggle('r',m-l>4)}
function fitTab(){
  const b=SH[cur].tab,want=b.offsetLeft-(tabs.clientWidth-b.offsetWidth)/2,max=tabs.scrollWidth-tabs.clientWidth;
  tabs.scrollLeft=Math.max(0,Math.min(max,want));fade();
}
tabs.addEventListener('scroll',fade,{passive:true});
addEventListener('resize',()=>{if(cur>=0)fitTab()});
function show(i){
  if(i===cur)return;cur=i;
  SH.forEach((S,j)=>{S.el.hidden=j!==i;S.tab.setAttribute('aria-current',j===i?'page':'false')});
  const S=SH[i];window.scrollTo(0,0);fitTab();
  DB.d.last=S.id;DB.save();
  S.el.querySelector('.head').animate([{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],{duration:T(420),easing:EASE});
  enter(S,S.labs.filter(l=>l.offsetParent));S.play();
}
function go(i){i=(i+SH.length)%SH.length;if(location.hash==='#'+SH[i].id)show(i);else location.hash=SH[i].id}
const idx=id=>SH.findIndex(S=>S.id===id);
const fromHash=()=>{const k=idx(location.hash.slice(1));if(k>=0)return k;const l=idx(DB.d.last);return l>=0?l:0};
addEventListener('hashchange',()=>show(fromHash()));
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(e.key>='1'&&e.key<=String(SH.length))go(+e.key-1);
  else if(e.key==='ArrowRight')go(cur+1);
  else if(e.key==='ArrowLeft')go(cur-1);
});
/* 맨 위로 */
const onScroll=()=>totop.classList.toggle('on',(window.pageYOffset||0)>500);
addEventListener('scroll',onScroll,{passive:true});
totop.onclick=()=>{try{window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'})}catch(e){window.scrollTo(0,0)}};
onMQ(MQV,()=>SH.forEach(draw));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{SH.forEach(draw);if(cur>=0)fitTab()});
show(fromHash());onScroll();

</script>

</body>
</html>
